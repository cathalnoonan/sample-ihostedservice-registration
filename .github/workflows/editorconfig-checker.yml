name: EditorConfig Checker

on:
  push:
    branches:
      - '**'

jobs:
  editorconfig-checker:
    name: EditorConfig Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npx -y editorconfig-checker
